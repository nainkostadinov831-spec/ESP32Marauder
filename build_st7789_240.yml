name: Build Marauder - NodeMCU-32 ST7789 240x240

on:
  workflow_dispatch:

jobs:
  build:
    name: Build GENERIC_ESP32 (ST7789 240x240)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Bootstrap ESP32 core (via TestFile)
        uses: ArminJo/arduino-test-compile@v3.3.0
        with:
          sketch-names: TestFile.ino
          arduino-board-fqbn: esp32:esp32:esp32
          arduino-platform: esp32:esp32@3.3.4
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/3.3.4/package_esp32_dev_index.json

      # ---- Third-party libraries (pinned to the same versions the official builds use) ----
      - name: Install ESP32Ping
        uses: actions/checkout@v2
        with: { repository: marian-craciunescu/ESP32Ping, ref: "1.6", path: CustomESP32Ping }

      - name: Install AsyncTCP
        uses: actions/checkout@v2
        with: { repository: ESP32Async/AsyncTCP, ref: v3.4.8, path: CustomAsyncTCP }

      - name: Install MicroNMEA
        uses: actions/checkout@v2
        with: { repository: stevemarple/MicroNMEA, ref: v2.0.6, path: CustomMicroNMEA }

      - name: Install ESPAsyncWebServer
        uses: actions/checkout@v2
        with: { repository: ESP32Async/ESPAsyncWebServer, ref: v3.8.1, path: CustomESPAsyncWebServer }

      - name: Install TFT_eSPI
        uses: actions/checkout@v2
        with: { repository: Bodmer/TFT_eSPI, ref: V2.5.34, path: CustomTFT_eSPI }

      - name: Install XPT2046_Touchscreen
        uses: actions/checkout@v2
        with: { repository: PaulStoffregen/XPT2046_Touchscreen, ref: v1.4, path: CustomXPT2046_Touchscreen }

      - name: Install lv_arduino
        uses: actions/checkout@v2
        with: { repository: lvgl/lv_arduino, ref: "3.0.0", path: Customlv_arduino }

      - name: Install JPEGDecoder
        uses: actions/checkout@v2
        with: { repository: Bodmer/JPEGDecoder, ref: "1.8.0", path: CustomJPEGDecoder }

      - name: Install NimBLE-Arduino
        uses: actions/checkout@v2
        with: { repository: h2zero/NimBLE-Arduino, ref: "2.3.8", path: CustomNimBLE-Arduino }

      - name: Install Adafruit_NeoPixel
        uses: actions/checkout@v2
        with: { repository: adafruit/Adafruit_NeoPixel, ref: "1.12.0", path: CustomAdafruit_NeoPixel }

      - name: Install ArduinoJson
        uses: actions/checkout@v2
        with: { repository: bblanchon/ArduinoJson, ref: v6.18.2, path: CustomArduinoJson }

      - name: Install LinkedList
        uses: actions/checkout@v2
        with: { repository: ivanseidel/LinkedList, ref: v1.3.3, path: CustomLinkedList }

      - name: Install EspSoftwareSerial
        uses: actions/checkout@v2
        with: { repository: plerup/espsoftwareserial, ref: "8.1.0", path: CustomEspSoftwareSerial }

      - name: Install Adafruit_BusIO
        uses: actions/checkout@v2
        with: { repository: adafruit/Adafruit_BusIO, ref: "1.15.0", path: CustomAdafruit_BusIO }

      - name: Install Adafruit_MAX1704X
        uses: actions/checkout@v2
        with: { repository: adafruit/Adafruit_MAX1704X, ref: "1.0.2", path: CustomAdafruit_MAX1704X }

      - name: Install Adafruit_TCA8418
        run: cp -r libraries/Adafruit_TCA8418 CustomAdafruit_TCA8418

      # ---- Point TFT_eSPI at our 240x240 ST7789 setup ----
      - name: Configure TFT_eSPI
        run: |
          rm -f CustomTFT_eSPI/User_Setup_Select.h
          cp User*.h CustomTFT_eSPI/
          grep -n "st7789_240" CustomTFT_eSPI/User_Setup_Select.h

      # ---- Patch platform.txt for arduino-esp32 3.3.4 (matches the official workflow) ----
      - name: Modify platform.txt
        run: |
          for i in $(find /home/runner/.arduino15/packages/esp32/hardware/esp32/ -name "platform.txt"); do
            sed -i 's/compiler.c.elf.extra_flags=/compiler.c.elf.extra_flags=-Wl,-zmuldefs /' "$i"
          done
          for f in $(find /home/runner/.arduino15/packages/esp32/tools/esp32-arduino-libs/ -name "cpp_flags"); do
            sed -i 's/-fexceptions/-fno-exceptions/g' "$f"
          done

      - name: Build Marauder (GENERIC_ESP32 / ST7789 240x240)
        uses: ArminJo/arduino-test-compile@v3.3.0
        with:
          sketch-names: esp32_marauder.ino
          arduino-board-fqbn: esp32:esp32:esp32:PartitionScheme=min_spiffs
          extra-arduino-cli-args: "--warnings none --build-property compiler.cpp.extra_flags='-DGENERIC_ESP32'"
          arduino-platform: esp32:esp32@3.3.4
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/3.3.4/package_esp32_dev_index.json

      - name: Rename and upload artifact
        run: |
          BUILD_DIR=./esp32_marauder/build/esp32.esp32.esp32
          OUTPUT_BIN=esp32_marauder_st7789_240x240.bin
          mv "$BUILD_DIR/esp32_marauder.ino.bin" "$BUILD_DIR/$OUTPUT_BIN"
          echo "artifact_path=$BUILD_DIR/$OUTPUT_BIN" >> $GITHUB_ENV
          echo "bootloader_path=$BUILD_DIR/esp32_marauder.ino.bootloader.bin" >> $GITHUB_ENV
          echo "partitions_path=$BUILD_DIR/esp32_marauder.ino.partitions.bin" >> $GITHUB_ENV

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32_marauder_st7789_240x240
          path: |
            ${{ env.artifact_path }}
            ${{ env.bootloader_path }}
            ${{ env.partitions_path }}
          retention-days: 14
